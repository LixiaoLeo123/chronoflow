[project]
name = "chronoflow-server"
version = "0.1.0"
description = "Invite-gated local-first sync API for Chronoflow"
requires-python = ">=3.12"
dependencies = [
  "argon2-cffi>=23.1.0",
  "fastapi>=0.115.0",
  "pyjwt>=2.9.0",
  "uvicorn[standard]>=0.30.6",
]

[project.optional-dependencies]
test = ["httpx>=0.27.2", "pytest>=8.3.3"]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
