name: chronoflow
description: Local-first Pomodoro and timeline tracking.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  collection: ^1.18.0
  connectivity_plus: ^6.0.5
  crypto: ^3.0.3
  drift: ^2.20.3
  flutter_riverpod: ^2.5.1
  flutter_secure_storage: ^9.2.2
  go_router: ^14.2.7
  http: ^1.2.2
  intl: ^0.19.0
  uuid: ^4.5.1
  workmanager: ^0.5.2
  tray_manager: ^0.5.3
  window_manager: ^0.4.3
  flutter_local_notifications: ^22.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.12
  drift_dev: ^2.20.3
  flutter_lints: ^4.0.0
  mocktail: ^1.0.4
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
    - assets/tray/

flutter_launcher_icons:
  image_path: "assets/icon/chronoflow.png"
  adaptive_icon_background: "#0F172A"
  adaptive_icon_foreground: "assets/icon/chronoflow_foreground.png"
  android: true
  ios: false
  linux:
    image_path: "assets/icon/chronoflow.png"
